<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wybierz postać</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom right, #f0f0f5, #d9d9e6);
      margin: 0;
      padding: 0;
      color: #333;
    }
    header {
      text-align: center;
      padding: 2rem;
    }
    .characters {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .character-button {
      padding: 1rem 2rem;
      background-color: #b3b3cc;
      border: none;
      border-radius: 1rem;
      font-size: 1.2rem;
      cursor: pointer;
      color: white;
      transition: background-color 0.3s;
    }
    .character-button:hover {
      background-color: #9999b3;
    }
    .character-info {
      text-align: center;
      padding: 1rem;
    }
    .character-info img {
      max-width: 200px;
      border-radius: 1rem;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Wybierz postać</h1>
  </header>

  <div class="characters">
    <button class="character-button" onclick="showCharacter('maria')">Maria</button>
    <button class="character-button" onclick="showCharacter('ruda')">Ruda</button>
    <button class="character-button" onclick="showCharacter('stara')">Stara</button>
    <button class="character-button" onclick="showCharacter('martynix')">Martynix</button>
    <button class="character-button" onclick="showCharacter('marta')">Marta</button>
  </div>

  <div class="character-info" id="characterInfo"></div>

  <script>
    const characterData = {
      maria: {
        name: 'Maria',
        age: 25,
        traits: 'Towarzyska, zabawna, spontaniczna',
        description: 'Maria to dusza towarzystwa, uwielbia przygody i podróże.',
        image: 'https://via.placeholder.com/200x250?text=Maria'
      },
      ruda: {
        name: 'Ruda',
        age: 28,
        traits: 'Inteligentna, sarkastyczna, niezależna',
        description: 'Ruda jest ostra jak brzytwa i zawsze ma ripostę pod ręką.',
        image: 'https://via.placeholder.com/200x250?text=Ruda'
      },
      stara: {
        name: 'Stara',
        age: 33,
        traits: 'Doświadczona, opanowana, cierpliwa',
        description: 'Stara zna życie jak nikt inny, potrafi słuchać i doradzić.',
        image: 'https://via.placeholder.com/200x250?text=Stara'
      },
      martynix: {
        name: 'Martynix',
        age: 22,
        traits: 'Zabawna, ekstrawagancka, pewna siebie',
        description: 'Martynix to wybuchowa mieszanka humoru i charyzmy.',
        image: 'https://via.placeholder.com/200x250?text=Martynix'
      },
      marta: {
        name: 'Marta',
        age: 26,
        traits: 'Ciepła, lojalna, empatyczna',
        description: 'Marta to osoba, której można zaufać bez wahania.',
        image: 'https://via.placeholder.com/200x250?text=Marta'
      }
    };

    function showCharacter(name) {
      const character = characterData[name];
      const infoDiv = document.getElementById('characterInfo');
      infoDiv.innerHTML = `
        <h2>${character.name}</h2>
        <p><strong>Wiek:</strong> ${character.age}</p>
        <p><strong>Cechy:</strong> ${character.traits}</p>
        <p><strong>Opis:</strong> ${character.description}</p>
        <img src="${character.image}" alt="${character.name}" />
      `;
    }
  </script>
</body>
</html>
